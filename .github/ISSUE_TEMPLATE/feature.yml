name: Feature request
description: A feature or change that would help your conference
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: Describe the concrete situation at the event (room, audience, operator) before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
