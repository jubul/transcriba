name: Bug report
description: Something does not work as the documentation says
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected and what happened. If it was during an event, say how many rooms and which engine.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. transcriba serve -c …
        2. open /ingest/room-a …
        3. …
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [gemini-live, gemini-live-translate, gemini-chunked, local, mock]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Audio source
      options: [browser, rtmp/srt/hls, pulse/alsa/device, file, other]
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `transcriba check` and `transcriba --version`, operating system, browser if relevant.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or `transcriba run … --log-level debug`. Remove the API key if it appears.
      render: text
