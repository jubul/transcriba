[project]
name = "transcriba"
version = "0.1.0"
description = "Subtítulos en vivo para conferencias: transcripción y traducción simultánea, multi-sala, open source."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Juan", email = "juan@bupalus.com" }]
keywords = ["captions", "subtitles", "live", "transcription", "translation", "gemini", "gemma", "conference", "accessibility"]
dependencies = [
  "google-genai>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "numpy>=1.24",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "httpx>=0.27",
  "qrcode>=7.4",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1"]
cuda = ["faster-whisper>=1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
transcriba = "transcriba.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriba"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
